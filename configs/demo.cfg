# Edit and save to replay in --preview, or re-export with tools/export_mp4.py.
# Unlisted values use defaults from DebugConfig.hpp and the stage 1 types.

# Terrain: height = base + slope_x*x + slope_z*z + smooth hills.
terrain_height = 0
slope_x = 0
slope_z = 0
hill_amplitude = 0.4     # metres; 0 makes a plane
hill_length = 80         # metres (20 to 1000)
# Approximate a medium fairway. See README for calibration conditions.
restitution = 0.22
static_friction = 0.45
dynamic_friction = 0.30
rolling_resistance = 0.145
spin_friction = 0.015
impact_braking = 0.55   # effective turf loss per m/s of incoming normal speed

# Environment and physics (SI units).
wind_x = 1
wind_y = 0
wind_z = 2
gravity_y = -9.80665
air_density = 1.225
mass = 0.04593
radius = 0.02135
drag = 0.25
lift_slope = 0.6
max_lift = 0.35
spin_decay = 0.04
physics_dt = 0.004166666666666667
max_substep = 0.001041666666666667

# Start position and actual impulses (N*s and N*m*s).
start_x = 0
start_z = 0
start_height = 0
impulse_x = 1.5
impulse_y = 0.87267
impulse_z = 0.04593
angular_impulse_x = 0
angular_impulse_y = 0.00008375
angular_impulse_z = 0.002093

# Camera offset from the tracked point, with +Y up.
camera_x = -10
camera_y = 5
camera_z = 14
camera_response = 5
camera_fov = 48

# Presentation; fps does not change physics_dt or the trajectory.
width = 1280
height = 720
fps = 30
max_duration = 60
end_hold = 2
